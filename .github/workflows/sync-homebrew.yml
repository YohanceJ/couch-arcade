name: Sync Homebrew Hub

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sync_homebrewhub.py
      - .github/workflows/sync-homebrew.yml

permissions:
  contents: write

concurrency:
  group: sync-homebrew
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog/homebrewhub.json
        run: python3 tools/sync_homebrewhub.py catalog/homebrewhub.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- catalog/homebrewhub.json && git ls-files --error-unmatch catalog/homebrewhub.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/homebrewhub.json
          git commit -m "Sync Homebrew Hub catalogue"
          git pull --rebase origin main
          git push
