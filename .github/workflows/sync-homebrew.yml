name: Sync Homebrew Hub

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sync_homebrewhub.py
      - .github/workflows/sync-homebrew.yml

permissions:
  contents: write

concurrency:
  group: sync-homebrew
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch game metadata (game.json files only, no ROMs)
        run: |
          for r in gbdev/database gbadev-org/games nesdev-org/homebrew-db; do
            git clone -q --depth 1 --filter=blob:limit=200k --no-checkout "https://github.com/$r" "src/$r"
            git -C "src/$r" sparse-checkout set --no-cone '/entries/*/game.json'
            git -C "src/$r" checkout -q
          done

      - name: Build catalog/homebrewhub.json
        run: |
          python3 tools/sync_homebrewhub.py catalog/homebrewhub.json \
            gbdev/database=src/gbdev/database \
            gbadev-org/games=src/gbadev-org/games \
            nesdev-org/homebrew-db=src/nesdev-org/homebrew-db

      - name: Commit if changed
        run: |
          git add catalog/homebrewhub.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Homebrew Hub catalogue"
          git pull --rebase origin main
          git push
