name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk couch-arcade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: couch-arcade-apk
          path: couch-arcade.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Couch Arcade build ${{ github.run_number }}
          body: |
            Install on Fire TV with Downloader using:
            https://github.com/${{ github.repository }}/releases/latest/download/couch-arcade.apk
          files: couch-arcade.apk
          make_latest: true

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every catalogue entry resolves to a download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_catalog.py catalog/catalog.json
